<div class="auth-wrapper auth-v2">
  <div class="auth-inner row m-0">
    <div class="auth-wrapper auth-v2">
      <div class="auth-inner row m-0">
        <!-- Brand logo--><a class="brand-logo" href="javascript:void(0);">
          <img src="{{ coreConfig.app.appLogoImage }}" alt="brand-logo" height="28" />
          <h2 class="brand-text text-primary ml-1">{{ coreConfig.app.appName }}</h2></a
        >
        <!-- /Brand logo-->
        <!-- Left Text-->
        <div class="d-none d-lg-flex col-lg-8 align-items-center p-5">
          <div class="w-100 d-lg-flex align-items-center justify-content-center px-5">
            <img
              class="img-fluid"
              [src]="
                coreConfig.layout.skin === 'dark'
                  ? 'assets/images/pages/register-v2-dark.svg'
                  : 'assets/images/pages/register-v2.svg'
              "
              alt="Register V2"
            />
          </div>
        </div>
        <!-- /Left Text-->

    <!-- Form Section -->
    <div class="d-flex col-lg-4 align-items-center auth-bg px-2 p-lg-5">
      <div class="col-12 col-sm-8 col-md-6 col-lg-12 px-xl-2 mx-auto">
        <h2 class="card-title font-weight-bold mb-1">Créer un compte utilisateur</h2>
        <p class="card-text mb-2">Veuillez remplir les informations ci-dessous</p>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-register-form mt-2">
          <!-- Nom -->
          <div class="form-group">
            <label for="nom">Nom</label>
            <input id="nom" formControlName="nom" class="form-control" placeholder="Entrez le nom" />
          </div>

          <!-- Prénom -->
          <div class="form-group">
            <label for="prenom">Prénom</label>
            <input id="prenom" formControlName="prenom" class="form-control" placeholder="Entrez le prénom" />
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" formControlName="email" class="form-control" placeholder="exemple@academy.com" />
          </div>

          <!-- Mot de passe -->
          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input id="password" type="password" formControlName="password" class="form-control" placeholder="············" />
          </div>

          <!-- Rôle -->
          <div class="form-group">
            <label for="role">Rôle</label>
            <select id="role" formControlName="role" class="form-control" (change)="onRoleChange($event.target.value)">
              <option value="">--Sélectionnez un rôle--</option>
              <option value="ETUDIANT">Étudiant</option>
              <!-- <option value="ENCADREUR">Encadreur</option>
              <option value="SECRETAIRE">Secrétaire</option> -->
            </select>
          </div>

          <!-- Champs spécifiques au rôle -->
          <div *ngIf="selectedRole === 'ETUDIANT'" class="form-group">
            <label for="matriculeEtudiant">Matricule Étudiant</label>
            <input id="matriculeEtudiant" formControlName="matriculeEtudiant" class="form-control" placeholder="Entrez le matricule" />
          </div>

          <!-- <div *ngIf="selectedRole === 'ENCADREUR'" class="form-group">
            <label for="matriculeEncadreur">Matricule Encadreur</label>
            <input id="matriculeEncadreur" formControlName="matriculeEncadreur" class="form-control" placeholder="Entrez le matricule" />
          </div>

          <div *ngIf="selectedRole === 'SECRETAIRE'" class="form-group">
            <label for="departement">Département</label>
            <input id="departement" formControlName="departement" class="form-control" placeholder="Entrez le département" />
          </div> -->

          <!-- Bouton de soumission -->
          <button type="submit" class="btn btn-primary btn-block mt-3">Créer le compte</button>
        </form>
