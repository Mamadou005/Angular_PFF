<!-- Chat Sidebar area -->
<div class="chat-sidebar bg-white">
  <button class="btn sidebar-close-icon" (click)="toggleSidebar('chat-sidebar')">
    <i data-feather="x"></i>
  </button>
  <!-- Sidebar header start -->
  <div class="chat-fixed-search">
    <div class="d-flex align-items-center w-100">
      <div class="sidebar-profile-toggle">
        <button class="btn avatar avatar-border bg-transparent p-0" (click)="toggleSidebar('chat-user-sidebar')">
          <img [src]="userProfile.avatar" alt="user_avatar" height="42" width="42" />
          <span
            [ngClass]="{
              'avatar-status-offline': userProfile.status == 'offline',
              'avatar-status-online': userProfile.status == 'online',
              'avatar-status-busy': userProfile.status == 'busy',
              'avatar-status-away': userProfile.status == 'away'
            }"
          ></span>
        </button>
      </div>
      <div class="input-group input-group-merge ml-1 w-100">
        <div class="input-group-prepend">
          <span class="input-group-text round"><i data-feather="search" class="text-muted"></i></span>
        </div>
        <input
          type="text"
          class="form-control round"
          id="chat-search"
          placeholder="Search or start a new chat"
          aria-label="Search..."
          aria-describedby="chat-search"
          [(ngModel)]="searchText"
        />
      </div>
    </div>
  </div>
  <!-- Sidebar header end -->

    <!-- Ajouter une Discussions -->
    <form (ngSubmit)="createDiscussion()" #discussionForm="ngForm">
        <div class="form-group">
            <label for="titre">Titre de la discussion</label>
            <input
                    type="text"
                    id="titre"
                    class="form-control"
                    required
                    [(ngModel)]="chats.titre"
                    name="titre"
                    #titre="ngModel"
            />
            <div *ngIf="titre.invalid && titre.touched" class="text-danger">
                Le titre est requis.
            </div>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea
                    id="description"
                    class="form-control"
                    required
                    [(ngModel)]="chats.description"
                    name="description"
                    #description="ngModel"
            ></textarea>
            <div *ngIf="description.invalid && description.touched" class="text-danger">
                La description est requise.
            </div>
        </div>

        <button
                type="submit"
                class="btn btn-primary"
                [disabled]="discussionForm.invalid"
        >
            Créer la discussion
        </button>
    </form>




    <!-- Sidebar Users start -->
  <div id="users-list" class="chat-user-list-wrapper list-group" [perfectScrollbar]>
    <h4 class="chat-list-title">Discussions</h4>
    <ng-container *ngIf="(chatUsers | filter: searchText:'fullName').length; else noResultsChats"></ng-container>
    <ul class="chat-users-list chat-list media-list">
      <li
        *ngFor="let chatUser of chatUsers | filter: searchText:'fullName'; let i = index"
        [class.active]="selectedIndex === i"
        (click)="openChat(chatUser.id); toggleSidebar('chat-sidebar'); setIndex(i)"
      >
        <span class="avatar bg-light-secondary "
        >
            <span class="avatar-content"><i data-feather="user"></i></span>
        </span>
        <div class="chat-info flex-grow-1">
          <h5 class="mb-0">{{ chatUser.titre }}</h5>
          <p class="card-text text-truncate">
            {{ chatUser.description }}
          </p>
        </div>
        <div class="chat-meta text-nowrap">
          <small class="float-right mb-25 chat-time">4:14 PM</small>
          <span *ngIf="chatUser.unseenMsgs >= 1" class="float-right badge badge-danger badge-pill">{{
            chatUser.unseenMsgs
          }}</span>
        </div>
      </li>

      <ng-template #noResultsChats>
        <li class="no-results" [ngClass]="{ show: (chatUsers | filter: searchText:'fullName').length <= 0 }">
          <h6 class="mb-0">No Chats Found</h6>
        </li>
      </ng-template>
    </ul>

  <!-- Sidebar Users end -->
</div>
<!--/ Chat Sidebar area -->
