<!-- Admin user profile area -->
<div class="chat-user-sidebar">
  <header class="chat-profile-header">
    <button class="btn close-icon p-0" (click)="toggleSidebar('chat-user-sidebar')">
      <i data-feather="x"></i>
    </button>
    <!-- User Information -->
    <div class="header-profile-sidebar">
      <div class="avatar box-shadow-1 avatar-xl avatar-border">
          <img src="assets/images/illustration/email.svg" alt="Meeting Pic" height="170" />
      </div>
        <h4 class="chat-user-name">Démarrer une conversation</h4>
      <span class="user-post">{{ userProfile.prenom + ' ' + userProfile.nom}}</span>
    </div>
      <!-- Ajouter une Discussions -->

    <!--/ User Information -->
  </header>
    <form #discussionForm="ngForm">
  <!-- User Details start -->
  <div class="profile-sidebar-area" [perfectScrollbar]>
    <h6 class="section-label mb-1">Info conversation</h6>
    <div class="about-user">

            <div class="form-group">
                <label for="titre">Titre de la discussion</label>
                <input
                        type="text"
                        id="titre"
                        class="form-control"
                        [(ngModel)]="chats.titre"
                        required
                        name="titre"
                />

            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                        id="description"
                        class="form-control"
                        required
                        [(ngModel)]="chats.description"
                        name="description"
                        #description="ngModel"
                ></textarea>
                <div *ngIf="description.invalid && description.touched" class="text-danger">
                    La description est requise.
                </div>
            </div>

    </div>
    <!-- To set user status -->
    <h6 class="section-label mb-1 mt-3">Membres</h6>
      <div class="form-group">
          <label for="task-tag" class="form-label d-block">Membre chats</label>
          <ng-select
                  [items]="listUser"
                  [multiple]="true"
                  [closeOnSelect]="false"
                  [searchable]="false"
                  [(ngModel)]="chats.membres"
                  bindLabel="prenom"
                  name="membres"
          >
              <ng-template ng-label-tmp let-item="item">
                  <div class="media align-items-center px-2">
                      <div class="media-body">
                          <p class="mb-0">{{ item.prenom + " " + item.nom }}</p>
                      </div>
                  </div>
              </ng-template>
              <ng-template ng-option-tmp let-item="item">
                  <div class="media align-items-center">
                      <div class="media-body">
                          <p class="mb-0">{{ item.prenom + " " + item.nom }}</p>
                      </div>
                  </div>
              </ng-template>
          </ng-select>
      </div>

      <!--/ To set user status -->


    <!-- Logout Button -->
    <div class="mt-3">
      <button class="btn btn-primary" rippleEffect (click)="createDiscussion()"
              [disabled]="discussionForm.invalid">
        <span>Créer la discussion</span>
      </button>
    </div>
    <!--/ Logout Button -->
  </div>
    </form>
  <!-- User Details end -->
</div>
<!--/ Admin user profile area -->
