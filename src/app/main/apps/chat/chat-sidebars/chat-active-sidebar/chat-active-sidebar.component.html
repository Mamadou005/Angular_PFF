<!-- User Chat profile right area -->
<div class="active-user-profile-sidebar">
  <header class="user-profile-header">
    <button class="btn close-icon p-0" (click)="toggleSidebar('chat-active-sidebar')">
      <i data-feather="x"></i>
    </button>
    <!-- User Profile image with name -->
      <div class="header-profile-sidebar">
          <div class="avatar box-shadow-1 avatar-xl avatar-border">
              <img src="assets/images/illustration/email.svg" alt="Meeting Pic" height="170" />
          </div>
          <h4 class="chat-user-name">Information conversation</h4>
          <span class="user-post">{{ chatUser.titre }}</span>
      </div>
    <!--/ User Profile image with name -->
  </header>
  <div class="user-profile-sidebar-area" [perfectScrollbar]>
    <!-- About User -->
    <h6 class="section-label mb-1">Description</h6>
    <p>{{ chatUser.description }}</p>
    <!-- About User -->
    <!-- User's personal information -->
    <div class="personal-info">
      <h6 class="section-label mb-1 mt-3">Membres</h6>
      <ul class="list-unstyled">
        <li *ngFor="let membre of chatUser.membres" class="mb-1">
          <i data-feather="user" class="font-medium-2 mr-50"></i>
          <span class="align-middle">{{membre.prenom + " " + membre.nom}}</span>
        </li>
      </ul>
    </div>
    <!--/ User's personal information -->
  </div>
</div>
<!--/ User Chat profile right area -->
