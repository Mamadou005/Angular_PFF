<!-- Modal Full Screen -->
<div class="modal-dialog modal-fullscreen">
    <div class="modal-content p-0">
        <form
                id="form-modal-rapport"
                class="rapport-modal needs-validation"
                (ngSubmit)="onSubmit(rapportForm)"
                #rapportForm="ngForm"
                novalidate
        >
            <!-- Modal Header -->
            <div class="modal-header align-items-center mb-1">
                <h5 *ngIf="isDataEmpty; else updateRapportsRef" class="modal-title">
                    Ajouter un rapport
                </h5>
                <ng-template #updateRapportsRef>
                    <h5 class="modal-title">
                        Rapport: {{ rapport.titre }}
                    </h5>
                    <div class="rapport-item-action d-flex align-items-center justify-content-between ml-auto">
                        <button
                                (click)="toggleComplete()"
                                class="btn btn-sm"
                                [ngClass]="rapport.completed ? 'btn-outline-success' : 'btn-outline-secondary'"
                                rippleEffect
                        >
                            {{ rapport.completed ? 'Complété' : 'Marquer comme Complété' }}
                        </button>
                    </div>
                </ng-template>

                <div class="rapport-item-action d-flex align-items-center justify-content-between ml-auto">
                    <button
                            *ngIf="!isDataEmpty"
                            (click)="deleteRapport()"
                            type="button"
                            class="btn p-0 rapport-item-favorite cursor-pointer mr-75"
                    >
                        <i data-feather="trash" [size]="18"></i>
                    </button>

                    <button
                            (click)="closeSidebar()"
                            type="button"
                            class="close font-large-1 font-weight-normal py-0"
                            aria-label="Close"
                    >
                        &times;
                    </button>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="modal-body flex-grow-1 pb-sm-0 pb-3">
                <div class="action-tags">
                    <!-- Title Input -->
                    <div class="form-group">
                        <label for="rapportTitleAdd" class="form-label">Titre</label>
                        <input
                                type="text"
                                id="rapportTitleAdd"
                                name="addTitle"
                                class="new-rapport-item-title form-control"
                                placeholder="Entrez le titre du rapport"
                                [(ngModel)]="rapport.titre"
                                #RDNameRef="ngModel"
                                required
                        />
                        <small class="text-danger" *ngIf="rapportForm.submitted && RDNameRef.invalid">
                            Le titre est requis.
                        </small>
                    </div>

                    <!-- Due Date Picker -->
                    <!-- <div class="form-group position-relative">
                      <label for="task-due-date" class="form-label">Date d'échéance</label>
                      <ng2-flatpickr
                        id="task-due-date"
                        #dueDateRef
                        name="addDueDate"
                        [setDate]="rapport.echeance.description"
                        [(ngModel)]="rapport.echeance.description"
                        required
                      ></ng2-flatpickr>
                      <small class="text-danger" *ngIf="rapportForm.submitted && !dueDateRef.model">
                        La date d'échéance est requise.
                      </small>
                    </div> -->

                    <!-- Group Input -->
                    <!-- <div class="form-group">
                      <label for="groupeName" class="form-label">Groupe</label>
                      <input
                        type="text"
                        id="groupeName"
                        class="form-control"
                        [(ngModel)]="rapport.groupeEtudiant.nom"
                        name="groupe"
                        placeholder="Nom du groupe"
                        required
                      />
                      <small class="text-danger" *ngIf="rapportForm.submitted && !rapport.groupeEtudiant.nom">
                        Le nom du groupe est requis.
                      </small>
                    </div> -->

                    <!-- Content View -->
                    <div class="form-group">
                        <label for="rapportContent" class="form-label">Contenu</label>
                        <a
                                id="rapportContent"
                                [routerLink]="'/webview'"
                                [queryParams]="{ content: rapport.contenuUrl }"
                                class="btn btn-outline-primary"
                        >
                            Voir le contenu dans une nouvelle page
                        </a>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="form-group my-1 d-flex justify-content-end">
                    <button
                            type="submit"
                            class="btn btn-primary mr-1"
                            *ngIf="isDataEmpty"
                            [disabled]="!rapportForm.form.valid"
                            rippleEffect
                    >
                        Ajouter
                    </button>
                    <button
                            type="button"
                            class="btn btn-primary mr-1"
                            *ngIf="!isDataEmpty"
                            (click)="updateRapport()"
                            rippleEffect
                    >
                        Mettre à jour
                    </button>
                    <button
                            class="btn btn-outline-secondary"
                            type="button"
                            (click)="closeSidebar()"
                            rippleEffect
                    >
                        Annuler
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
