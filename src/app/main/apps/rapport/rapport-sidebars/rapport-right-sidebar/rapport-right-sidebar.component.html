<!-- Modal Full Screen -->
<div class="modal-dialog modal-fullscreen">
  <div class="modal-content p-0">
    <form
      id="form-modal-rapport"
      class="rapport-modal needs-validation"
      (ngSubmit)="onSubmit(rapportForm)"
      #rapportForm="ngForm"
    >
      <div class="modal-header align-items-center mb-1">
        <h5 *ngIf="isDataEmpty === true; else updateRapportsRef" class="modal-title">
          Ajouter un rapport
        </h5>
        <ng-template #updateRapportsRef>
          <h5 class="modal-title">Rapport: {{ rapport.titre }} ({{ rapport.echeance.description }})</h5>
          <div class="rapport-item-action d-flex align-items-center justify-content-between ml-auto">
            <button
              (click)="toggleComplete()"
              class="btn btn-sm"
              [ngClass]="rapport.completed ? 'btn-outline-success' : 'btn-outline-secondary'"
              rippleEffect
            >
              {{ rapport.completed ? 'Complété' : 'Marquer comme Complété' }}
            </button>
          </div>
        </ng-template>

        <div class="rapport-item-action d-flex align-items-center justify-content-between ml-auto">
          <button
            *ngIf="isDataEmpty === false"
            (click)="deleteRapport()"
            type="button"
            class="rapport-item-favorite cursor-pointer mr-75 btn p-0"
          >
            <i data-feather="trash" [size]="18"></i>
          </button>

          <button
            (click)="closeSidebar()"
            type="button"
            class="close font-large-1 font-weight-normal py-0"
            data-dismiss="modal"
            aria-label="Close"
          >
            ×
          </button>
        </div>
      </div>

      <div class="modal-body flex-grow-1 pb-sm-0 pb-3">
        <div class="action-tags">
          <!-- Title Input -->
          <div class="form-group">
            <label for="rapportTitleAdd" class="form-label">Titre</label>
            <input
              type="text"
              id="rapportTitleAdd"
              name="addTitle"
              class="new-rapport-item-title form-control"
              [class.error]="rapportForm.submitted && RDNameRef.invalid"
              placeholder="Titre"
              [(ngModel)]="rapport.titre"
              #RDNameRef="ngModel"
              required
            />
            <span *ngIf="rapportForm.submitted && RDNameRef.invalid" class="invalid-form">
              <small class="form-text text-danger" *ngIf="RDNameRef.errors.required">Ce champ est requis !</small>
            </span>
          </div>

          <!-- Due Date Picker -->
          <div class="form-group position-relative">
            <label for="task-due-date" class="form-label">Date d'échéance</label>
            <ng2-flatpickr
              #dueDateRef
              name="addDueDate"
              [setDate]="rapport.echeance.description"
            ></ng2-flatpickr>
          </div>

          <!-- Group Report Section -->
          <div class="form-group">
            <label class="form-label">Groupe</label>
            <input
              type="text"
              class="form-control"
              [(ngModel)]="rapport.groupeEtudiant.nom"
              name="groupe"
              placeholder="Nom du groupe"
              required
            />
          </div>

          <!-- Content View Button -->
          <div class="form-group">
            <label class="form-label">Contenu</label>
            <a
              [routerLink]="'/webview'"
              [queryParams]="{ content: rapport.contenuUrl }"
              class="btn btn-outline-primary"
            >
              Voir le contenu dans une nouvelle page
            </a>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="form-group my-1">
          <button
            type="submit"
            class="btn btn-primary add-rapport-item mr-1"
            *ngIf="isDataEmpty === true"
            [disabled]="!rapportForm.form.valid"
            rippleEffect
          >
            Ajouter
          </button>
          <button
            type="button"
            class="btn btn-primary update-btn update-rapport-item mr-1"
            *ngIf="isDataEmpty === false"
            (click)="updateRapport()"
            rippleEffect
          >
            Mettre à jour
          </button>
          <button
            class="btn btn-outline-secondary add-rapport-item"
            type="button"
            (click)="closeSidebar()"
            data-dismiss="modal"
            rippleEffect
          >
            Fermer
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
