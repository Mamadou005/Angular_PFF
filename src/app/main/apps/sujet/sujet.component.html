<div class="content-area-wrapper container-xxl p-0">
    <!-- Todo Main Sidebar (Filter) -->
    <core-sidebar
            class="sidebar-left"
            name="todo-sidebar-main"
            overlayClass="body-content-overlay"
            collapsibleSidebar="bs-gt-lg"
    >
        <app-sujet-main-sidebar></app-sujet-main-sidebar>
    </core-sidebar>
    <!--/ Todo Main Sidebar -->

    <!-- content-right -->
    <div class="content-right">
        <div class="content-wrapper container-xxl p-0">
            <div class="content-body">
                <!-- Todo List -->
                <app-sujet-list></app-sujet-list>
                <!--/ Todo List -->

                <!-- Todo Right Sidebar (Detail) -->
                <core-sidebar
                        class="modal modal-slide-in sidebar-todo-modal fade"
                        name="todo-sidebar-right"
                        overlayClass="modal-backdrop"
                        hideOnEsc="true"
                >
                    <app-sujet-right-sidebar></app-sujet-right-sidebar>
                </core-sidebar>
                <!--/ Todo Right Sidebar -->
            </div>
        </div>
    </div>
    <!--/ content-right -->
</div>
