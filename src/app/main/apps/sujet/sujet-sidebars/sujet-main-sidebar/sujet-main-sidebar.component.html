<!-- Main Sidebar -->
<div class="main-sidebar sidebar">
    <div class="sidebar-content sujet-sidebar">
      <div class="sujet-app-menu" [perfectScrollbar]>
      
        <!-- Ajouter un sujet -->
        <div class="add-task">
          <button
            type="button"
            class="btn btn-primary btn-block"
            (click)="createSujet('sujet-sidebar-right', 'sujet-sidebar-main')"
            rippleEffect
          >
            Nouveau sujet
          </button>
        </div>
        <!-- Si showForm est vrai, afficher le formulaire -->
        <div class="sidebar-form" *ngIf="showForm">
          <form (ngSubmit)="createNewSujet()">
            <!-- Contenu du formulaire -->
            <div class="form-group">
              <label for="sujetTitle">Titre</label>
              <input type="text" id="sujetTitle" class="form-control" [(ngModel)]="sujet.titre" name="titre" required>
            </div>
            
            <div class="form-group">
              <label for="sujetDescription">Description</label>
              <textarea id="sujetDescription" class="form-control" [(ngModel)]="sujet.description" name="description" required></textarea>
            </div>
            
            <div class="form-group">
              <button type="submit" class="btn btn-primary">
                Enregistrer
              </button>
            </div>
          </form>
        </div>
  
        <div class="sidebar-menu-list">
          <div class="list-group list-group-filters">
            <!-- Boucle sur les filtres -->
            <a
              *ngFor="let filter of filters"
              [routerLink]="'/apps/sujet/' + filter.handle"
              [routerLinkActive]="'active'"
              class="list-group-item list-group-item-action"
              (click)="toggleSidebar('sujet-sidebar-main')"
            >
              <i [data-feather]="filter.icon" [size]="18" class="mr-75"></i>
              <span class="align-middle">{{ filter.titre }}</span>
            </a>
          </div>
  
          <div class="list-group list-group-labels">
            <!-- Boucle sur les tags -->
            <!-- <a
              *ngFor="let tag of tags"
              [routerLink]="'/apps/sujet/tag/' + tag.handle"
              [routerLinkActive]="'active'"
              class="list-group-item list-group-item-action d-flex align-items-center"
              (click)="toggleSidebar('sujet-sidebar-main')"
            >
              <span class="bullet bullet-sm mr-1 {{ tag.color }}"></span>{{ tag.titre }}
            </a> -->
          </div>
        </div>
      </div>
    </div>
  </div>
