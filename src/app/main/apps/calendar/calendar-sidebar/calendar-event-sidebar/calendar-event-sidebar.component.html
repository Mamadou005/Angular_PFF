<!-- Calendar Add/Update/Delete event modal-->
<div class="modal-dialog sidebar-lg">
  <div class="modal-content p-0">
    <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="toggleEventSidebar()">
      ×
    </button>
    <div class="modal-header mb-1">
      <h5 class="modal-title">{{ isDataEmpty === true ? 'Ajouter' : 'Mise a jour' }} Echeance</h5>
    </div>
    <div class="modal-body flex-grow-1 pb-sm-0 pb-3">
      <form
        class="event-form needs-validation"
        (ngSubmit)="(eventForm.form.valid); eventForm.reset()"
        #eventForm="ngForm"
      >
        <div class="form-group">
          <label for="title" class="form-label">Titre</label>
          <input
            type="text"
            class="form-control"
            id="title"
            name="titre"
            placeholder="Entrer le titre de l'echeance"
            required
            [(ngModel)]="event.titre"
            [class.error]="eventForm.submitted && formNameRef.invalid"
            #formNameRef="ngModel"
          />
          <span *ngIf="eventForm.submitted && formNameRef.invalid" class="invalid-form">
            <small class="form-text text-danger" *ngIf="formNameRef.errors.required">This field is required!</small>
          </span>
        </div>
        <div class="form-group position-relative">
          <label for="start-date" class="form-label">Date Debut</label>
          <ng2-flatpickr
            [config]="startDateOptions"
            name="dateDebut"
            [setDate]="event.dateDebut"
            #startDatePicker
            required
            [class.error]="eventForm.submitted"
          ></ng2-flatpickr>
        </div>
        <div class="form-group position-relative">
          <label for="end-date" class="form-label">Date Fin</label>
          <ng2-flatpickr
            [config]="endDateOptions"
            name="dateFin"
            [setDate]="event.dateFin"
            #endDatePicker
            required
            [class.error]="eventForm.submitted"
          ></ng2-flatpickr>
        </div>
        <div class="form-group">
          <div class="custom-control custom-switch">
            <input
              type="checkbox"
              class="custom-control-input allDay-switch"
              id="customSwitch3"
              [(ngModel)]="event.allDay"
              name="allDay"
            />
          </div>
        </div>
        <div class="form-group d-flex">
          <button
                  [disabled] = "!isSecretaire"
            type="submit"
            class="btn btn-primary add-event-btn mr-1"
            *ngIf="isDataEmpty !== false; else addEventRef"
            (click)="addEvent(eventForm)"
            rippleEffect
          >
            Ajouter
          </button>
          <button
            type="button"
            class="btn btn-outline-secondary btn-cancel"
            data-dismiss="modal"
            (click)="toggleEventSidebar()"
            *ngIf="isDataEmpty !== false; else deleteEventRef"
            rippleEffect
          >
            Annuler
          </button>
          <ng-template #addEventRef>
            <button type="submit" class="btn btn-primary update-event-btn mr-1" (click)="updateEvent()" rippleEffect [disabled] = "!isSecretaire">
              Mise a jour
            </button>
          </ng-template>
          <ng-template #deleteEventRef>
            <button class="btn btn-outline-danger btn-delete-event" (click)="deleteEvent()" rippleEffect>Supprimer</button>
          </ng-template>
        </div>
      </form>
    </div>
  </div>
</div>
<!--/ Calendar Add/Update/Delete event modal-->
