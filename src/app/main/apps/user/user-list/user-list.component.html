<div class="content-wrapper container-xxl p-0">
  <div class="content-body">
    <!-- Liste des utilisateurs -->
    <section class="users-list-wrapper">
      <!-- Début du filtre des utilisateurs -->
      <div class="card">
        <h5 class="card-header">Filtre de recherche</h5>
        <div class="card-body">
          <div class="users-list-filter">
            <form>
              <div class="row">
                <div class="col-12 col-md-4">
                  <fieldset class="form-group">
                    <ng-select
                      [items]="selectedRole"
                      [(ngModel)]="selectedRole"
                      name="selectedRole"
                      bindLabel="name"
                      placeholder="Rechercher par rôle"
                      (change)="filterByRole($event)"
                    ></ng-select>
                  </fieldset>
                </div>
                <div class="col-12 col-md-4">
                  <fieldset class="form-group">
                    <ng-select
                      [items]="selectDepartement"
                      [(ngModel)]="selectDepartement"
                      name="selectDepartement"
                      bindLabel="name"
                      placeholder="Rechercher par matricule"
                      (change)="filterByPlan($event)"
                    ></ng-select>
                  </fieldset>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <!-- Fin du filtre des utilisateurs -->

      <div class="card">
        <div class="row">
          <div class="col-md-6 col-12">
            <div class="d-flex justify-content-between align-items-center m-1">
              <label class="d-flex align-items-center">
                Afficher
                <select class="form-control mx-25" [(ngModel)]="selectedOption">
                  <option value="10">10</option>
                  <option value="25">25</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
                entrées
              </label>
            </div>
          </div>
          <div class="col-md-6 col-12 d-flex justify-content-start justify-content-md-end">
            <div class="d-flex align-items-center justify-content-end pr-1 pb-1 pb-md-0">
              <label class="d-flex align-items-center ml-1 ml-md-0">
                Recherche:
                <input
                  [(ngModel)]="searchValue"
                  name="searchValue"
                  type="search"
                  class="form-control ml-25"
                  (keyup)="filterUpdate($event)"
                  (search)="filterUpdate($event)"
                />
              </label>
              <button class="btn btn-primary ml-1" rippleEffect (click)="toggleSidebar('new-user-sidebar')">
                <i data-feather="plus" class="d-sm-none d-inline-block mr-0 mr-sm-1"></i
                ><span class="d-none d-sm-inline-block">Nouvel utilisateur</span>
              </button>
            </div>
          </div>
        </div>
        <ngx-datatable
          [rows]="rows"
          [rowHeight]="50"
          class="bootstrap core-bootstrap"
          [limit]="selectedOption"
          [columnMode]="ColumnMode.force"
          [headerHeight]="50"
          [footerHeight]="50"
          [scrollbarH]="true"
        >
          <ngx-datatable-column name="Utilisateur" prop="fullName" [width]="200">
            <ng-template let-row="row" let-name="value" ngx-datatable-cell-template>
              <div class="d-flex align-items-center">
                <ng-template #customAvatar>
                  <div
                    class="avatar mr-1 ml-0"
                    [ngClass]="{
                      'bg-light-success': row.status == 'active',
                      'bg-light-secondary': row.status == 'inactive',
                      'bg-light-warning': row.status == 'pending'
                    }"
                  >
                    <div class="avatar-content">{{ name | initials }}</div>
                  </div>
                </ng-template>
                <div class="cell-line-height">
                  <a routerLink="/apps/user/user-view/{{ row.id }}" class="font-medium-1 d-block">
                    <span class="font-weight-bold">{{ name }}</span>
                  </a>
                  <span class="text-muted font-small-2"> @{{ row.prenom}} {{ row.nom}}</span>
                </div>
              </div>
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Email" prop="email" [width]="200"></ngx-datatable-column>
          <ngx-datatable-column name="Rôle" prop="role" [width]="100">
            <ng-template let-role="value" ngx-datatable-cell-template>
              <div>
                <i
                  class="feather font-medium-3"
                  [ngClass]="{
                    'icon-settings text-warning': role == 'encadreur',
                    'icon-database text-success': role == 'etudiant',
                    'icon-user text-primary': role == 'secretaire',
                    'icon-slack text-danger': role == 'admin'
                  }"
                ></i>
                {{ role }}
              </div>
            </ng-template>
          </ngx-datatable-column>
          <ngx-datatable-column name="Matricule" prop="matricule" [width]="200"></ngx-datatable-column>
          <ngx-datatable-column name="Actions" [width]="40" [sortable]="false">
            <ng-template ngx-datatable-cell-template let-row="row">
              <div ngbDropdown container="body">
                <button ngbDropdownToggle type="button" class="btn icon-btn btn-sm hide-arrow" rippleEffect>
                  <span [data-feather]="'more-vertical'" [class]="'cursor-pointer'"></span>
                </button>
                <div ngbDropdownMenu>
                  <a routerLink="/apps/user/user-view/{{ row.id }}" ngbDropdownItem>
                    <span [data-feather]="'file-text'" [size]="16" [class]="'mr-50'"></span> Détails
                  </a>
                  <a routerLink="/apps/user/user-edit/{{ row.id }}" ngbDropdownItem>
                    <span [data-feather]="'edit'" [size]="16" [class]="'mr-50'"></span> Modifier
                  </a>
                  <a href="javascript:;" ngbDropdownItem>
                    <span [data-feather]="'trash'" [size]="16" [class]="'mr-50'"></span> Supprimer
                  </a>
                </div>
              </div>
            </ng-template>
          </ngx-datatable-column>
        </ngx-datatable>
      </div>
    </section>
    <!--/ Liste des utilisateurs -->
  </div>

  <!-- Sidebar pour ajouter un nouvel utilisateur -->
  <core-sidebar
    class="modal modal-slide-in sidebar-todo-modal fade"
    name="new-user-sidebar"
    overlayClass="modal-backdrop"
  >
    <app-new-user-sidebar></app-new-user-sidebar>
  </core-sidebar>
  <!--/ Sidebar pour ajouter un nouvel utilisateur -->
</div>
