<div class="slideout-content">
  <!-- Modal to add new user starts-->
  <div class="modalsd modal-slide-in sdfade new-user-modal" id="modals-slide-in">
    <div class="modal-dialog">
      <form class="add-new-user modal-content pt-0" (ngSubmit)="(newUserForm.form.valid)" #newUserForm="ngForm">
        <button
          type="button"
          class="close"
          data-dismiss="modal"
          aria-label="Close"
          (click)="toggleSidebar('new-user-sidebar')"
        >
          ×
        </button>
        <div class="modal-header mb-1">
          <h5 class="modal-title" id="exampleModalLabel">Créer un compte utilisateur</h5>
        </div>
        <div class="modal-body flex-grow-1">
          <!-- Nom -->
          <div class="form-group">
            <label class="form-label" for="basic-icon-default-nom">Nom</label>
            <input
              type="text"
              class="form-control"
              id="basic-icon-default-nom"
              placeholder="Entrez le nom"
              name="nom"
              [(ngModel)]="nom"
              [class.error]="newUserForm.submitted && nomRef.invalid"
              #nomRef="ngModel"
              required
            />
            <span *ngIf="newUserForm.submitted && nomRef.invalid" class="invalid-form">
              <small class="form-text text-danger">Ce champ est obligatoire !</small>
            </span>
          </div>

          <!-- Prénom -->
          <div class="form-group">
            <label class="form-label" for="basic-icon-default-prenom">Prénom</label>
            <input
              type="text"
              class="form-control"
              id="basic-icon-default-prenom"
              placeholder="Entrez le prénom"
              name="prenom"
              [(ngModel)]="prenom"
              [class.error]="newUserForm.submitted && prenomRef.invalid"
              #prenomRef="ngModel"
              required
            />
            <span *ngIf="newUserForm.submitted && prenomRef.invalid" class="invalid-form">
              <small class="form-text text-danger">Ce champ est obligatoire !</small>
            </span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="basic-icon-default-email">Email</label>
            <input
              type="email"
              class="form-control"
              id="basic-icon-default-email"
              placeholder="exemple@academy.com"
              name="email"
              [(ngModel)]="email"
              [class.error]="newUserForm.submitted && emailRef.invalid"
              #emailRef="ngModel"
              required
            />
            <span *ngIf="newUserForm.submitted && emailRef.invalid" class="invalid-form">
              <small class="form-text text-danger">Ce champ est obligatoire !</small>
            </span>
          </div>

          <!-- Mot de passe -->
          <div class="form-group">
            <label class="form-label" for="basic-icon-default-password">Mot de passe</label>
            <input
              type="password"
              class="form-control"
              id="basic-icon-default-password"
              placeholder="············"
              name="password"
              [(ngModel)]="password"
              [class.error]="newUserForm.submitted && passwordRef.invalid"
              #passwordRef="ngModel"
              required
            />
            <span *ngIf="newUserForm.submitted && passwordRef.invalid" class="invalid-form">
              <small class="form-text text-danger">Ce champ est obligatoire !</small>
            </span>
          </div>

          <!-- Rôle -->
          <div class="form-group">
            <label class="form-label" for="user-role">Rôle</label>
            <select
              id="user-role"
              class="form-control"
              name="role"
              [(ngModel)]="selectedRole"
              required
            >
              <option value="">--Sélectionnez un rôle--</option>
              <option value="ETUDIANT">Étudiant</option>
              <option value="ENCADREUR">Encadreur</option>
              <option value="SECRETAIRE">Secrétaire</option>
            </select>
          </div>

          <!-- Champs spécifiques au rôle -->
          <div *ngIf="selectedRole === 'ETUDIANT'" class="form-group">
            <label for="matriculeEtudiant">Matricule Étudiant</label>
            <input
              id="matriculeEtudiant"
              class="form-control"
              name="matriculeEtudiant"
              [(ngModel)]="matriculeEtudiant"
              placeholder="Entrez le matricule"
              required
            />
          </div>

          <div *ngIf="selectedRole === 'ENCADREUR'" class="form-group">
            <label for="matriculeEncadreur">Matricule Encadreur</label>
            <input
              id="matriculeEncadreur"
              class="form-control"
              name="matriculeEncadreur"
              [(ngModel)]="matriculeEncadreur"
              placeholder="Entrez le matricule"
              required
            />
          </div>

          <div *ngIf="selectedRole === 'SECRETAIRE'" class="form-group">
            <label for="departement">Département</label>
            <input
              id="departement"
              class="form-control"
              name="departement"
              [(ngModel)]="departement"
              placeholder="Entrez le département"
              required
            />
          </div>

          <!-- Boutons -->
          <button type="submit" class="btn btn-primary mr-1" (click)="submit(newUserForm)">Créer le compte</button>
          <button
            type="reset"
            class="btn btn-outline-secondary"
            (click)="toggleSidebar('new-user-sidebar')"
          >
            Annuler
          </button>
        </div>
      </form>
    </div>
  </div>
  <!-- Modal to add new user Ends-->
</div>
