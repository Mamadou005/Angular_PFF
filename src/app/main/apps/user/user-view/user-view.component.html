<div class="content-wrapper container-xxl p-0">
  <div class="content-body">
    <!-- page users view start -->
    <section class="app-user-view">
      <div class="row">
        <div class="col-xl-9 col-lg-8 col-md-7">
          <div class="card user-card">
            <div class="card-body">
              <div class="row">
                <!-- Section Avatar et Info Utilisateur -->
                <div class="col-xl-6 col-lg-12 d-flex flex-column justify-content-between border-container-lg">
                  <div class="user-avatar-section">
                    <div class="d-flex justify-content-start">
                      <div class="mr-1 ml-0">
                        <div
                          [ngClass]="{
                            'bg-light-success': data?.status === 'active',
                            'bg-light-secondary': data?.status === 'inactive',
                            'bg-light-warning': data?.status === 'pending'
                          }"
                          class="rounded p-3"
                        >
                          <h2
                            [ngClass]="{
                              'text-success': data?.status === 'active',
                              'text-secondary': data?.status === 'inactive',
                              'text-warning': data?.status === 'pending'
                            }"
                            class="m-0"
                          >
                            {{ data?.fullName | initials }}
                          </h2>
                        </div>
                      </div>
                    </div>
                    <div class="d-flex flex-column ml-1">
                      <div class="user-info mb-1">
                        <h4 class="mb-0">{{ data?.fullName }}</h4>
                        <span class="card-text">{{ data?.email }}</span>
                      </div>
                      <div class="d-flex flex-wrap">
                        <a routerLink="/apps/user/user-edit/{{ data?.id }}" class="btn btn-primary" rippleEffect>Modifier</a>
                        <button class="btn btn-outline-danger ml-1" rippleEffect>Supprimer</button>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Section Informations Utilisateur -->
                <div class="col-xl-6 col-lg-12 mt-2 mt-xl-0">
                  <div class="user-info-wrapper">
                    <div class="d-flex flex-wrap">
                      <div class="user-info-title">
                        <i data-feather="user" class="mr-1"></i>
                        <span class="card-text user-info-title font-weight-bold mb-0">Nom d'utilisateur</span>
                      </div>
                      <p class="card-text mb-0">{{ data?.nom }} {{ data?.prenom }}</p>
                    </div>
                    <div class="d-flex flex-wrap my-50">
                      <div class="user-info-title">
                        <i data-feather="check" class="mr-1"></i>
                        <span class="card-text user-info-title font-weight-bold mb-0">Statut</span>
                      </div>
                      <p class="card-text mb-0">{{ data?.status }}</p>
                    </div>
                    <div class="d-flex flex-wrap my-50">
                      <div class="user-info-title">
                        <i data-feather="star" class="mr-1"></i>
                        <span class="card-text user-info-title font-weight-bold mb-0">Rôle</span>
                      </div>
                      <p class="card-text mb-0">{{ data?.role }}</p>
                    </div>
                    <div class="d-flex flex-wrap">
                      <div class="user-info-title">
                        <i data-feather="phone" class="mr-1"></i>
                        <span class="card-text user-info-title font-weight-bold mb-0">Matricule</span>
                      </div>
                      <p class="card-text mb-0">{{ data?.matricule }}</p>
                    </div>
                    <div class="d-flex flex-wrap my-50">
                      <div class="user-info-title">
                        <i data-feather="briefcase" class="mr-1"></i>
                        <span class="card-text user-info-title font-weight-bold mb-0">Département</span>
                      </div>
                      <p class="card-text mb-0">{{ data?.departement || 'Non spécifié' }}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- page users view end -->
  </div>
</div>
